<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A0C0C"/>
      <stop offset="55%" stop-color="#2A0505"/>
      <stop offset="100%" stop-color="#160000"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF2"/>
      <stop offset="34%" stop-color="#FFD23A"/>
      <stop offset="100%" stop-color="#FF8A1E"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D9922F"/>
      <stop offset="45%" stop-color="#A85F14"/>
      <stop offset="100%" stop-color="#6B3405"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF9A3C" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF7A18" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Deep maroon ground, matching the site background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Warm halo so the flame reads even at 16px -->
  <circle cx="256" cy="250" r="150" fill="url(#glow)"/>

  <!-- Diya flame -->
  <path d="M256 128 C 230 184, 202 212, 202 248 a 54 54 0 0 0 108 0 c 0 -36 -28 -64 -54 -120 z"
        fill="url(#flame)" stroke="#2A0505" stroke-width="14" paint-order="stroke"/>

  <!-- Lamp bowl -->
  <path d="M112 306 A 144 144 0 0 0 400 306 Z" fill="url(#bowl)"/>
  <!-- Rim highlight -->
  <rect x="104" y="292" width="304" height="26" rx="13" fill="#F0B44A"/>
</svg>
